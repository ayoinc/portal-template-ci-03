name: Hugo CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: '0.169.0'
  D2_VERSION: '0.9.0'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hugo downloads the theme module with the Go toolchain.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --gc --minify

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for misconfigurations and committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '1'

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs with the TechDocs and D2 plugins
        run: pip install mkdocs-techdocs-core==1.7.1 mkdocs-d2-plugin==1.7.0

      - name: Install D2
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2

      - name: Build documentation
        run: mkdocs build --strict

  pages:
    name: Check GitHub Pages
    # Deployment needs GitHub Pages switched on with "GitHub Actions" as its
    # source (Settings > Pages). Until then the deploy job is skipped.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Read the GitHub Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          build_type="$(gh api "repos/$REPOSITORY/pages" --jq '.build_type' 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled with the GitHub Actions source, so the site is not deployed. Enable it under Settings > Pages and run this workflow again."
          fi

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, security, pages]
    if: needs.pages.outputs.enabled == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hugo downloads the theme module with the Go toolchain.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # The site is built for the address GitHub Pages serves it from.
      - name: Build
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "$PAGES_BASE_URL/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
